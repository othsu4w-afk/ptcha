<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>派案管理系統</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --bg-color: #f4f6f7;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin: 20px;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .login-box, .app-content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }

        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .hint {
            font-size: 13px;
            color: #777;
            margin-top: 5px;
        }

        .hint.warning {
            color: var(--accent-color);
        }

        .hidden {
            display: none;
        }

        .tab-buttons {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #666;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: var(--secondary-color);
            border-bottom-color: var(--secondary-color);
        }

        /* 關鍵字搜尋下拉選單與可輸入樣式 */
        .combobox-container {
            position: relative;
        }

        datalist {
            position: absolute;
            max-height: 200px;
            overflow-y: auto;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #eef2f5;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">派案管理系統</div>

    <!-- 登入區域 -->
    <div id="loginSection" class="login-box">
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="empId">職務編號</label>
                <input type="text" id="empId" placeholder="請輸入職編" required autocomplete="off">
                <div class="hint">請輸入職編</div>
            </div>
            <button type="submit" class="btn">登入</button>
        </form>
    </div>

    <!-- 主系統區域 -->
    <div id="appSection" class="app-content hidden">
        <div class="user-info">
            <span>登入身分：<strong id="currentUser"></strong></span>
            <button onclick="handleLogout()" style="background:none; border:none; color:var(--accent-color); cursor:pointer; text-decoration:underline;">登出</button>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('regular')">一般派案</button>
            <button class="tab-btn" onclick="switchTab('other')">其他派案</button>
        </div>

        <!-- 一般派案 -->
        <div id="regularTab">
            <form onsubmit="handleSubmit(event, '一般派案')">
                <div class="form-group">
                    <label>個案姓名</label>
                    <input type="text" placeholder="請輸入個案姓名" required>
                </div>
                <div class="form-group">
                    <label>服務單位</label>
                    <select required>
                        <option value="">請選擇單位</option>
                        <option value="A單位">A單位 - 社區整合型服務中心</option>
                        <option value="B單位">B單位 - 居家照護服務中心</option>
                        <option value="C單位">C單位 - 巷弄長照站</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>聯絡電話</label>
                    <input type="text" placeholder="0912-345-678">
                </div>
                <button type="submit" class="btn">送出派案</button>
            </form>
        </div>

        <!-- 其他派案 -->
        <div id="otherTab" class="hidden">
            <form onsubmit="handleSubmit(event, '其他派案')">
                <div class="form-group">
                    <label>個案姓名</label>
                    <input type="text" placeholder="請輸入個案姓名" required>
                </div>
                <div class="form-group">
                    <label for="otherServiceUnit">服務單位</label>
                    <!-- 支援關鍵字搜尋與手動輸入新名稱 -->
                    <input type="text" id="otherServiceUnit" list="unitOptions" placeholder="請輸入或搜尋服務單位全銜" required>
                    <datalist id="unitOptions">
                        <option value="財團法人屏東基督教醫院">
                        <option value="社團法人屏東縣長期照護服務協會">
                        <option value="屏東縣政府衛生局">
                        <option value="高雄榮民總醫院屏東分院">
                        <option value="衛生福利部屏東醫院">
                    </datalist>
                    <!-- 提示需輸入全銜 -->
                    <div class="hint warning">提示：請輸入完整服務單位全銜（可手動輸入新增或關鍵字搜尋）</div>
                </div>
                <!-- 修正：已移除電話欄位 -->
                <button type="submit" class="btn">送出派案</button>
            </form>
        </div>
    </div>
</div>

<script>
    const DEFAULT_ADMIN = "06190";

    function handleLogin(e) {
        e.preventDefault();
        const empId = document.getElementById('empId').value.trim();
        if (!empId) return;

        let roleText = "一般使用者 (" + empId + ")";
        if (empId === DEFAULT_ADMIN) {
            roleText = "系統管理員 (" + empId + ")";
        }

        document.getElementById('currentUser').textContent = roleText;
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
    }

    function handleLogout() {
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('empId').value = '';
    }

    function switchTab(type) {
        const btns = document.querySelectorAll('.tab-btn');
        btns.forEach(b => b.classList.remove('active'));
        
        if (type === 'regular') {
            btns[0].classList.add('active');
            document.getElementById('regularTab').classList.remove('hidden');
            document.getElementById('otherTab').classList.add('hidden');
        } else {
            btns[1].classList.add('active');
            document.getElementById('regularTab').classList.add('hidden');
            document.getElementById('otherTab').classList.remove('hidden');
        }
    }

    function handleSubmit(e, type) {
        e.preventDefault();
        alert(type + ' 已成功送出！');
    }
</script>

</body>
</html>
