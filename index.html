<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屏東縣長照A單位 B單位公平輪派與管理系統 (115年版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        .bg-pending { background-color: #d1fae5 !important; }
        .text-overtime { color: #dc2626 !important; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-teal-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-hand-holding-medical text-2xl text-teal-300"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">115年屏東長照B單位公平輪派與管理系統</h1>
                    <p class="text-xs text-teal-200">轄區 12 鄉鎮 17 類型服務單位派案與時效稽核（全數 299 家合作單位）</p>
                </div>
            </div>
            <div id="userInfoHeader" class="hidden flex items-center space-x-4">
                <span class="bg-teal-700 px-3 py-1 rounded-full text-sm border border-teal-500">
                    <i class="fa-solid fa-user-check mr-1"></i> <span id="currentUserLabel"></span>
                </span>
                <button onclick="logout()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs px-3 py-1.5 rounded transition shadow">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> 登出
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">

        <!-- Login Section (Modal/View) -->
        <div id="loginView" class="fixed inset-0 bg-slate-900 bg-opacity-75 flex items-center justify-center z-50 p-4">
            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 space-y-6">
                <div class="text-center space-y-2">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-teal-100 text-teal-700 mb-2">
                        <i class="fa-solid fa-user-shield text-3xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">屏東長照 A 單位派案系統</h2>
                    <p class="text-xs text-gray-500">因應個資法防護，請先輸入職務編號進行身份驗證</p>
                </div>

                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">登入身分與職務編號</label>
                        <select id="loginRoleSelect" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-teal-500 focus:border-teal-500 text-sm">
                            <option value="manager">個管員 / 輔助管理者 (請輸入職編)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">請輸入您的職編</label>
                        <input type="text" id="staffIdInput" required placeholder="請輸入職編" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-teal-500 focus:border-teal-500 text-sm">
                    </div>

                    <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-2.5 rounded-lg shadow hover:shadow-lg transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>安全登入系統</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div id="appTabs" class="hidden mb-6 bg-white rounded-lg shadow p-2 flex flex-wrap gap-2 justify-between items-center">
            <div class="flex flex-wrap gap-2">
                <button onclick="switchTab('tab-dispatch')" id="btn-tab-dispatch" class="px-4 py-2 rounded-md font-medium text-sm transition flex items-center space-x-1.5 bg-teal-600 text-white shadow">
                    <i class="fa-solid fa-rotate"></i>
                    <span>一般輪派</span>
                </button>
                <button onclick="switchTab('tab-other')" id="btn-tab-other" class="px-4 py-2 rounded-md font-medium text-sm transition flex items-center space-x-1.5 text-gray-600 hover:bg-gray-100">
                    <i class="fa-solid fa-list-check"></i>
                    <span>其他派案</span>
                </button>
                <button onclick="switchTab('tab-stats')" id="btn-tab-stats" class="px-4 py-2 rounded-md font-medium text-sm transition flex items-center space-x-1.5 text-gray-600 hover:bg-gray-100">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>派案成功與時效統計</span>
                </button>
                <button id="adminTabBtn" onclick="switchTab('tab-admin')" class="px-4 py-2 rounded-md font-medium text-sm transition flex items-center space-x-1.5 text-gray-600 hover:bg-gray-100">
                    <i class="fa-solid fa-sliders"></i>
                    <span>系統設定與權限管理</span>
                </button>
            </div>
            <div>
                <button onclick="resetSystemData()" class="text-xs text-gray-500 hover:text-rose-600 px-2 py-1 rounded border border-gray-200">
                    <i class="fa-solid fa-arrows-rotate mr-1"></i>重置測試數據
                </button>
            </div>
        </div>

        <!-- TAB 1: 一般輪派 -->
        <div id="tab-dispatch" class="tab-content hidden space-y-6">
            <div class="bg-white rounded-xl shadow p-6 border-l-4 border-teal-600">
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fa-solid fa-filter text-teal-600 mr-2"></i>第一與第二層分類篩選
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">第一層：服務區域 (12 鄉鎮)</label>
                        <select id="dispatchDistrict" onchange="updateDispatchUnitOptions()" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-teal-500 focus:border-teal-500 text-sm">
                            <option value="">-- 請選擇鄉鎮區域 --</option>
                            <option value="屏東市">屏東市</option>
                            <option value="萬丹鄉">萬丹鄉</option>
                            <option value="長治鄉">長治鄉</option>
                            <option value="麟洛鄉">麟洛鄉</option>
                            <option value="九如鄉">九如鄉</option>
                            <option value="里港鄉">里港鄉</option>
                            <option value="鹽埔鄉">鹽埔鄉</option>
                            <option value="高樹鄉">高樹鄉</option>
                            <option value="萬巒鄉">萬巒鄉</option>
                            <option value="竹田鄉">竹田鄉</option>
                            <option value="潮州鎮">潮州鎮</option>
                            <option value="內埔鄉">內埔鄉</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">第二層：服務類型 (17 類別)</label>
                        <select id="dispatchService" onchange="updateDispatchUnitOptions()" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-teal-500 focus:border-teal-500 text-sm">
                            <option value="">-- 請選擇服務類型 --</option>
                            <option value="居家服務">居家服務</option>
                            <option value="到宅沐浴">到宅沐浴</option>
                            <option value="日間照顧">日間照顧</option>
                            <option value="家庭托顧">家庭托顧</option>
                            <option value="專業服務">專業服務</option>
                            <option value="居家喘息">居家喘息</option>
                            <option value="日照喘息">日照喘息</option>
                            <option value="機構喘息">機構喘息</option>
                            <option value="小規機喘息">小規機喘息</option>
                            <option value="巷弄喘息">巷弄喘息</option>
                            <option value="餐飲服務">餐飲服務</option>
                            <option value="失智共照">失智共照</option>
                            <option value="失智據點">失智據點</option>
                            <option value="家照者支持">家照者支持</option>
                            <option value="團體家屋">團體家屋</option>
                            <option value="交通接送">交通接送</option>
                            <option value="BD03">BD03</option>
                        </select>
                    </div>

                    <div class="flex items-end">
                        <div class="bg-amber-50 border border-amber-200 rounded-md p-2 text-xs text-amber-800 w-full">
                            <i class="fa-solid
